apiVersion: v1
kind: HorizontalPodAutoscaler
metadata:
  name: demo-devops-hpa
  namespace: demo-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-devops-nodejs
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80